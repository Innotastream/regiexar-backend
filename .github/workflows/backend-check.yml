name: Vérifier le backend Régie

on:
  push:
    branches:
      - main
      - codex/backend-0.12.27
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Signaler le démarrage des contrôles backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="pending" \
            -f context="backend-check" \
            -f description="Syntaxe PHP et contrats backend en cours" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Domain backward compatibility
        run: php tests/domain-backward-compatibility.php
      - name: Architecture contracts
        run: node --test tests/*.test.mjs

      - name: Publier le résultat des contrôles backend
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            state="success"
            description="Syntaxe PHP et contrats backend validés"
          else
            state="failure"
            description="Échec de la validation backend"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="backend-check" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
