name: Vérifier le backend Régie

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
        env:
          MARIADB_ROOT_PASSWORD: regie-audit-local-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - '127.0.0.1:33307:3306'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Signaler le démarrage des contrôles backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="pending" \
            -f context="backend-check" \
            -f description="Syntaxe PHP et contrats backend en cours" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Domain backward compatibility
        run: php tests/domain-backward-compatibility.php
      - name: Exact current-version login policy
        run: php tests/client-policy.php
      - name: Monotonic backend release authority
        run: php tests/backend-release-anti-rollback.php
      - name: Tactical lifecycle and concurrent conditions
        run: php tests/tactical-lifecycle.php
      - name: Ability casting costs and cooldowns
        run: php tests/ability-casting-contract.php
      - name: Complex multi-step ability lifecycle
        run: php tests/complex-abilities-contract.php
      - name: Assistant classic abilities and repair
        run: php tests/ability-assistant-contract.php
      - name: Authoritative tactical rolls and audio loops
        run: php tests/tactical-rolls-audio-contract.php
      - name: Image Studio conversation idempotence
        run: php tests/image-studio-idempotence-contract.php
      - name: Authenticated diagnostic logs and expiring shares
        run: php tests/diagnostics-contract.php
      - name: Private PHP warning and failure journal
        run: php tests/runtime-diagnostics-contract.php
      - name: Reliability audit regressions
        run: |
          php tests/backend-future-schema.php
          php tests/connection-heartbeat.php
          php tests/path-footprint.php
          php tests/media-access-lifecycle.php
          php tests/combat-audit-contract.php
          php tests/ability-validation-contract.php
          php tests/pending-ability-domain-contract.php
      - name: Real SQL media concurrency and heartbeat
        env:
          XAR_TEST_MYSQL_ALLOW_LOCAL: '1'
          XAR_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=33307;charset=utf8mb4'
          XAR_TEST_MYSQL_USER: root
          XAR_TEST_MYSQL_PASSWORD: regie-audit-local-only
          XAR_TEST_MYSQL_ROOT: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'
          set -o pipefail
          php tests/mysql-media-concurrency.php | tee mysql-concurrency.log
          grep -Fq 'Local MySQL concurrency integration passed.' mysql-concurrency.log
      - name: Architecture contracts
        run: node --test tests/*.test.mjs

      - name: Publier le résultat des contrôles backend
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            state="success"
            description="Syntaxe PHP et contrats backend validés"
          else
            state="failure"
            description="Échec de la validation backend"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="backend-check" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
