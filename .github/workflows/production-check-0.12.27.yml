name: Contrôler temporairement la production Régie

on:
  push:
    branches:
      - codex/backend-0.12.27
    paths:
      - .github/workflows/production-check-0.12.27.yml

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Santé et politique cliente
        shell: bash
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          health_code="$(curl --silent --show-error --location --output "$health_file" --write-out '%{http_code}' https://regie-xar-tsaroth.fr/api/v1/health)"
          echo "health_http=$health_code"
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({status:h.status,version:h.version,build:h.build,clientPolicy:h.clientPolicy,ownershipRepair:h.ownershipRepair}));' "$health_file"
          for version in 2.5.12 2.5.13 2.5.14; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --header "X-Xar-Client-Version: $version" https://regie-xar-tsaroth.fr/api/v1/auth/me)"
            echo "client_${version}=$code"
          done
